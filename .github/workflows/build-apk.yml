name: Build PixieFit APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PixieFit
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          echo "Using ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Find Android project
        run: |
          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Could not find gradlew"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Fix Gradle version
        run: |
          echo "Updating Gradle to 8.11.1"
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-all.zip#' "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Gradle wrapper:"
          cat "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

      - name: Build PixieFit
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload PixieFit APK
        uses: actions/upload-artifact@v4
        with:
          name: PixieFit-APK
          path: ${{ env.APK_PATH }}
