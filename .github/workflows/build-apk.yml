name: Build PixieFit APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PixieFit
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          echo "Using ZIP: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

      - name: Find Android project
        run: |
          BUILD_FILE=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE=$(find extracted -type f -name "build.gradle" | head -n 1)
          fi

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Could not find Android build files"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build PixieFit
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK FOUND: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload PixieFit APK
        uses: actions/upload-artifact@v4
        with:
          name: PixieFit-APK
          path: ${{ env.APK_PATH }}
