name: Build PixieFit APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PixieFit
        uses: actions/checkout@v4

      - name: Extract PixieFit project
        run: |
          unzip -o PixieFit-Android-Project.zip -d extracted
          find extracted -maxdepth 2 -type f | head -50

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build PixieFit
        working-directory: extracted/PixieFit-Android
        run: gradle --no-daemon assembleDebug

      - name: Upload PixieFit APK
        uses: actions/upload-artifact@v4
        with:
          name: PixieFit-APK
          path: extracted/PixieFit-Android/app/build/outputs/apk/debug/app-debug.apk
